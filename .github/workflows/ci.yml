name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Os testes usam Testcontainers; o runner do GitHub já traz Docker.
      - name: Build e testes
        run: ./mvnw -B verify
      - name: Docs do Modulith (artefato)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modulith-docs
          path: backend/target/spring-modulith-docs
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Testes
        run: npm run test:ci
      - name: Build de produção
        run: npm run build
