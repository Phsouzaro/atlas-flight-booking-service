name: atlas-flight-booking-service

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flightsai}
      POSTGRES_USER: ${POSTGRES_USER:-flightsai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # traces (OpenTelemetry): UI em http://localhost:16686, procure pelo X-Trace-Id de uma resposta
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "16686:16686"

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
    environment:
      # logs em JSON (ECS), com trace id e usuário em cada linha
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-flightsai}
      DB_USER: ${POSTGRES_USER:-flightsai}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # perfil local liga o seeder do catálogo (voos simulados); troque no .env se não quiser
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-missing}   # sem chave o assistente responde 503
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4.1-mini}
    ports:
      - "8080:8080"

  # Angular servido por nginx, com proxy de /api para o backend: abra http://localhost:4200
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "4200:8080"

volumes:
  pgdata:
