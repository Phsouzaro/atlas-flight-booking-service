# Serve o Angular e repassa /api/* para o backend, tirando o prefixo: /api/bookings vira /bookings.
# Mesma origem para front e API: sem CORS, e o token nunca sai para outro domínio.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # um turno do assistente chama o modelo e as tools: pode levar vários segundos
        proxy_read_timeout 90s;
        client_max_body_size 64k;
    }

    # arquivos com hash no nome: cache longo
    location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # rotas do Angular caem no index.html, que nunca fica em cache
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
