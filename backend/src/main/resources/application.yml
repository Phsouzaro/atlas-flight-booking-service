spring:
  application:
    name: atlas-flight-booking-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flightsai}
    username: ${DB_USER:flightsai}
    password: ${DB_PASSWORD:flightsai}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # o schema é de responsabilidade do Flyway, o Hibernate só confere
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50   # coleções lazy carregam em lote, não uma query por entidade
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true         # erros de validação e de framework em application/problem+json
  ai:
    openai:
      # sem chave o app sobe, mas o assistente responde 503 (ver AssistantProperties)
      api-key: ${OPENAI_API_KEY:missing}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4.1-mini}
          temperature: 0.2
      embedding:
        options:
          model: text-embedding-3-small
    vectorstore:
      pgvector:
        initialize-schema: false   # tabela criada pela V11 do Flyway
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
    retry:
      max-attempts: 2

management:
  endpoints:
    web:
      exposure:
        # prometheus fica aberto para o scraper da rede interna; o nginx não repassa /api/actuator para fora
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0   # projeto de demonstração: todo request vira trace. Em produção, baixar.
  observations:
    key-values:
      application: atlas-flight-booking-service
  # o export dos traces só liga com management.otlp.tracing.endpoint (o Compose aponta para o Jaeger)

app:
  security:
    jwt:
      secret: ${JWT_SECRET:}   # obrigatório, mínimo 32 bytes; sem ele a aplicação não sobe
      ttl: 15m                 # curto de propósito: a sessão continua pelo refresh token
    refresh:
      ttl: 7d                  # sem uso por 7 dias, a sessão acaba
      max-lifetime: 30d        # e acaba de qualquer jeito 30 dias depois do login
      reuse-grace: 10s         # duas abas renovando juntas não é roubo
      cookie-name: atlas_refresh
      cookie-path: /
      cookie-secure: true      # navegadores aceitam Secure em http://localhost
  booking:
    hold-ttl: 15m
    expiration-job-enabled: true
    expiration-interval: PT30S
    expiration-batch-size: 100
  pending-actions:
    ttl: 10m
  assistant:
    prompt-version: v1
    max-input-chars: 2000
    max-output-tokens: 800
    max-tool-calls-per-turn: 6
    max-model-calls-per-turn: 4
    history-window: 20
    policies:
      ingest-on-startup: true
      top-k: 4
  rate-limit:
    enabled: true
    rules:
      login:
        method: POST
        path: /auth/login
        key: IP
        capacity: 20
        period: 1m
      refresh:
        method: POST
        path: /auth/refresh
        key: IP
        capacity: 30
        period: 1m
      register:
        method: POST
        path: /auth/register
        key: IP
        capacity: 5
        period: 1h
      chat-minute:
        method: POST
        path: /assistant/conversations/*/messages
        key: USER
        capacity: 10
        period: 1m
      chat-day:                # teto de custo com o modelo, por usuário
        method: POST
        path: /assistant/conversations/*/messages
        key: USER
        capacity: 200
        period: 1d
    login-failures:            # senha errada por email, além do limite por IP
      capacity: 5
      period: 15m

server:
  # atrás do nginx do front, o IP do cliente vem no X-Forwarded-For; o Tomcat só confia nele vindo de
  # rede interna (é o que o rate limit por IP usa)
  forward-headers-strategy: native

springdoc:
  api-docs:
    # 3.0 e não 3.1: o 3.1 não tem "nullable", e o cliente gerado do front precisa saber quais campos vêm nulos
    version: openapi_3_0
  swagger-ui:
    path: /swagger-ui.html
